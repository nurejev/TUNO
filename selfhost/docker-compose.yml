# ======================================================================
# TUNO self-hosted — docker compose example (ENCA's R06 compose file, ported in beta 10693).
#
#   docker compose up -d        → http://localhost:8080
#
# BEFORE SIGNING IN, read the redirect-URI section of SELF-HOSTING.md:
# every host you serve TUNO from must be registered as a SPA redirect URI
# on the app registration, and http://localhost:8080 is a host too. It is
# the one step that cannot be automated, and skipping it is what produces
# the AADSTS50011 sign-in error.
# ======================================================================
services:
  tuno:
    image: ghcr.io/nurejev/tuno:beta   # beta-channel copy; :latest for production
    container_name: tuno
    restart: unless-stopped
    ports:
      - "8080:80"
    # Point this instance at YOUR OWN app registration instead of the shared
    # multi-tenant one - the client id New-TunoAppRegistration.ps1 printed.
    # TUNO_TENANT_ID only for a single-tenant registration; omit it otherwise.
    # Both are optional: with neither set the image behaves as it always did.
    #
    # TUNO_BRANDING is this deployment's look for EVERY visitor - the value the
    # gear's "Copy for container" button produces. The volume mount below does
    # the same thing from a file; use whichever suits. TUNO_BRANDING_URL is for
    # a look too large for an environment variable.
    environment:
      TUNO_CLIENT_ID: "${TUNO_CLIENT_ID:-}"
      TUNO_TENANT_ID: "${TUNO_TENANT_ID:-}"
      TUNO_BRANDING: "${TUNO_BRANDING:-}"
      TUNO_BRANDING_URL: "${TUNO_BRANDING_URL:-}"
    # Optional: brand this deployment without forking. Export the file from
    # the ⚙ branding settings (gear next to Sign out) and uncomment:
    # volumes:
    #   - ./selfhost-branding.json:/usr/share/nginx/html/selfhost-branding.json:ro
